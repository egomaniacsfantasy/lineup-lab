# This blueprint manages STAGING and the ESPN login worker. It does NOT manage
# production: `Olympus App (lineup-lab)` is configured in the dashboard, so
# changing `plan` here would resize staging and leave the live service
# untouched. Worth knowing before anyone edits this expecting to upgrade the
# site.
#
# Since the frontend moved to a CDN, oddsgods.net serves the static site and the
# API answers on its own Render address. Anything that needs the API by URL
# wants that address, not oddsgods.net, which is now the frontend.
services:
  - type: web
    name: olympus
    runtime: node
    plan: starter
    # Staging tracks its own branch. Pointed at main it redeployed the same
    # commit as production, which is a second copy of production rather than a
    # place to try anything.
    branch: staging
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # Persistent disk: projections imports, confirmed name matches, line
    # history, and the daily player-catalog snapshot live in server/data.
    # Without this disk they are wiped on every deploy.
    disk:
      name: olympus-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: ESPN_LOGIN_ENABLED
        value: "true"
      - key: VITE_ESPN_LOGIN_ENABLED
        value: "true"
      - key: ESPN_LOGIN_WORKER_URL
        value: "https://odds-gods-espn-login-worker.onrender.com"
      - key: ADMIN_PASSWORD
        sync: false
  - type: web
    name: odds-gods-espn-login-worker
    runtime: node
    plan: starter
    rootDir: espn-login-worker
    buildCommand: npm install && npm run install:browsers
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: ESPN_LOGIN_WORKER_ENABLED
        value: "true"
      # Playwright installs browsers to ~/.cache by default, and Render does not
      # carry that from build into runtime — so `playwright install chromium`
      # succeeded at build time and the binary was gone at run time. Every login
      # died ~0.9s in, before ESPN was ever contacted. 0 installs into
      # node_modules, which lives in the project directory and does persist.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: MAX_CONCURRENT_LOGINS
        value: "2"
      - key: MAX_LOGIN_QUEUE
        value: "10"
      - key: LOGIN_TIMEOUT_MS
        value: "30000"
      - key: PLAYWRIGHT_PROXY_SERVER
        sync: false
