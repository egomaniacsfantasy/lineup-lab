services:
  - type: web
    name: olympus
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # Persistent disk: projections imports, confirmed name matches, line
    # history, and the daily player-catalog snapshot live in server/data.
    # Without this disk they are wiped on every deploy.
    disk:
      name: olympus-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: ESPN_LOGIN_ENABLED
        value: "true"
      - key: ESPN_LOGIN_WORKER_URL
        value: "https://odds-gods-espn-login-worker.onrender.com"
      - key: ADMIN_PASSWORD
        sync: false
  - type: web
    name: odds-gods-espn-login-worker
    runtime: node
    plan: starter
    rootDir: espn-login-worker
    buildCommand: npm install && npm run install:browsers
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: ESPN_LOGIN_WORKER_ENABLED
        value: "true"
      - key: MAX_CONCURRENT_LOGINS
        value: "2"
      - key: MAX_LOGIN_QUEUE
        value: "10"
      - key: LOGIN_TIMEOUT_MS
        value: "30000"
      - key: PLAYWRIGHT_PROXY_SERVER
        sync: false
